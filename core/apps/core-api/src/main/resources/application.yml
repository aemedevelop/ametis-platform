server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/core_db?currentSchema=core}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      schema: ${CORE_DB_SCHEMA:core}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${CORE_DB_SCHEMA:core}
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/ametis}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

auth:
  keycloak:
    base-url: ${AUTH_KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${AUTH_KEYCLOAK_REALM:ametis}
    client-id: ${AUTH_KEYCLOAK_CLIENT_ID:core-api}
    client-secret: ${AUTH_KEYCLOAK_CLIENT_SECRET:}
    public-client-ids: ${AUTH_KEYCLOAK_PUBLIC_CLIENT_IDS:ametis-hub-web,newsletter-web,agent-factory-web}
    admin-realm: ${AUTH_KEYCLOAK_ADMIN_REALM:master}
    admin-client-id: ${AUTH_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-client-secret: ${AUTH_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${AUTH_KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:admin}
