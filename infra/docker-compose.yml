  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ametis-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:-jdbc:postgresql://vps-postgres-host:5432/keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-postgres}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - ametis_internal

  core-api:
    build:
      context: ../core/apps/core-api
      dockerfile: Dockerfile
    image: ametis/core-api:0.1.0
    container_name: ametis-core-api
    depends_on:
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${CORE_DB_URL:-jdbc:postgresql://vps-postgres-host:5432/core_db?currentSchema=core}
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:-postgres}
      CORE_DB_SCHEMA: ${CORE_DB_SCHEMA:-core}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${CORE_JWT_ISSUER:-http://localhost:8081/realms/ametis}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${CORE_JWT_JWK_SET_URI:-http://keycloak:8080/realms/ametis/protocol/openid-connect/certs}
      AUTH_KEYCLOAK_BASE_URL: ${AUTH_KEYCLOAK_BASE_URL:-http://keycloak:8080}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:-core-api-secret}
      AUTH_KEYCLOAK_PUBLIC_CLIENT_IDS: ${AUTH_KEYCLOAK_PUBLIC_CLIENT_IDS:-ametis-hub-web,agent-factory-web}
      AUTH_KEYCLOAK_ADMIN_REALM: ${AUTH_KEYCLOAK_ADMIN_REALM:-master}
      AUTH_KEYCLOAK_ADMIN_USERNAME: ${AUTH_KEYCLOAK_ADMIN_USERNAME:-admin}
      AUTH_KEYCLOAK_ADMIN_PASSWORD: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:-admin}
      CORE_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORE_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}
    ports:
      - "${CORE_API_PORT:-8090}:8080"
    networks:
      - ametis_internal

  kong:
    image: kong:3.7
    container_name: ametis-kong
    depends_on:
      - core-api
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl http2
    ports:
      - "${KONG_PROXY_PORT:-8440}:8000"
      - "${KONG_PROXY_TLS_PORT:-8443}:8443"
      - "${KONG_ADMIN_PORT:-8441}:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - ametis_internal

# Volúmenes comentados: usando postgres del VPS
# volumes:
#   ametis_postgres_data:

networks:
  ametis_internal:
    external: true
