services:
  agent-factory-app:
    build:
      context: ../apps/agent-factory-app
      dockerfile: Dockerfile
    image: ametis/agent-factory-app:0.1.0
    container_name: ametis-agent-factory-app
    depends_on:
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${AGENT_FACTORY_DB_URL:-jdbc:postgresql://13.140.179.140:5432/agent_factory_db}
      SPRING_DATASOURCE_USERNAME: ${AGENT_FACTORY_DB_USER:-agent_factory_user}
      SPRING_DATASOURCE_PASSWORD: ${AGENT_FACTORY_DB_PASSWORD:-agent_factory_pass}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AGENT_FACTORY_JWT_ISSUER:-http://localhost:8081/realms/ametis}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${AGENT_FACTORY_JWT_JWK_SET_URI:-http://keycloak:8080/realms/ametis/protocol/openid-connect/certs}
      AGENT_FACTORY_CORE_BASE_URL: ${AGENT_FACTORY_CORE_BASE_URL:-http://kong:8000}
      AGENT_FACTORY_GOOGLE_AUTH_MODE: ${AGENT_FACTORY_GOOGLE_AUTH_MODE:-workspace-oauth}
      AGENT_FACTORY_GOOGLE_CREDENTIALS_FILE: /run/secrets/google-drive-service-account.json
      AGENT_FACTORY_GOOGLE_OAUTH_CLIENT_ID: ${AGENT_FACTORY_GOOGLE_OAUTH_CLIENT_ID:-}
      AGENT_FACTORY_GOOGLE_OAUTH_CLIENT_SECRET: ${AGENT_FACTORY_GOOGLE_OAUTH_CLIENT_SECRET:-}
      AGENT_FACTORY_GOOGLE_OAUTH_REFRESH_TOKEN: ${AGENT_FACTORY_GOOGLE_OAUTH_REFRESH_TOKEN:-}
      AGENT_FACTORY_GOOGLE_OAUTH_REDIRECT_URI: ${AGENT_FACTORY_GOOGLE_OAUTH_REDIRECT_URI:-}
      AGENT_FACTORY_GOOGLE_FRONTEND_RETURN_URI: ${AGENT_FACTORY_GOOGLE_FRONTEND_RETURN_URI:-}
      AGENT_FACTORY_GOOGLE_TOKEN_ENCRYPTION_KEY: ${AGENT_FACTORY_GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      AGENT_FACTORY_GOOGLE_ROOT_FOLDER_ID: ${AGENT_FACTORY_GOOGLE_ROOT_FOLDER_ID:-}
      AGENT_FACTORY_AMETIS_AI_RAG_BASE_URL: ${AGENT_FACTORY_AMETIS_AI_RAG_BASE_URL:-}
    volumes:
      - ${AGENT_FACTORY_GOOGLE_CREDENTIALS_HOST_FILE:-../../ametis-ai/docker/compose/rag/secrets/google-drive-service-account.json}:/run/secrets/google-drive-service-account.json:ro
    ports:
      - "8083:8083"

  hub-web:
    build:
      context: ../frontend/web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${HUB_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CHAT_API_URL: ${CHAT_API_URL:-/api/rag-chat}
        NEXT_PUBLIC_CHAT_TENANT_ID: ${CHAT_TENANT_ID:-aeme}
        NEXT_PUBLIC_AGENT_FACTORY_WEB_URL: ${AGENT_FACTORY_WEB_URL:-http://localhost:3200}
        NEXT_PUBLIC_APP_URL: ${HUB_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL:-http://localhost:8081/realms/ametis/protocol/openid-connect/auth}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${HUB_KEYCLOAK_CLIENT_ID:-ametis-hub-web}
    image: ametis/hub-web:0.1.0
    container_name: ametis-hub-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${HUB_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_CHAT_API_URL: ${CHAT_API_URL:-/api/rag-chat}
      NEXT_PUBLIC_CHAT_TENANT_ID: ${CHAT_TENANT_ID:-aeme}
      RAG_CHAT_API_URL: ${RAG_CHAT_API_URL:-http://host.docker.internal:8000/tenants/aeme/agents/support_agent/knowledge-bases/landing/query}
      NEXT_PUBLIC_AGENT_FACTORY_WEB_URL: ${AGENT_FACTORY_WEB_URL:-http://localhost:3200}
      NEXT_PUBLIC_ALLOWED_REDIRECT_ORIGINS: ${ALLOWED_REDIRECT_ORIGINS:-http://localhost:3000,http://localhost:3200}
      NEXT_PUBLIC_APP_URL: ${HUB_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL:-http://localhost:8081/realms/ametis/protocol/openid-connect/auth}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${HUB_KEYCLOAK_CLIENT_ID:-ametis-hub-web}
    ports:
      - "${HUB_WEB_PORT:-3000}:3000"

  agent-factory-web:
    build:
      context: ../frontend/agent-factory-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENT_FACTORY_API_BASE_URL: ${AGENT_FACTORY_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_BASE_URL: ${HUB_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${AGENT_FACTORY_WEB_URL:-http://localhost:3200}
        NEXT_PUBLIC_HUB_URL: ${HUB_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL:-http://localhost:8081/realms/ametis/protocol/openid-connect/auth}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${AGENT_FACTORY_KEYCLOAK_CLIENT_ID:-agent-factory-web}
    image: ametis/agent-factory-web:0.1.0
    container_name: ametis-agent-factory-web
    ports:
      - "3200:3200"
