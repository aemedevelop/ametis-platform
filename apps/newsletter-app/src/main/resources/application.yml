server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newsletter_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        default_schema: newsletter
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: newsletter
    schemas: newsletter
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/ametis}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

newsletter:
  product:
    code: ${NEWSLETTER_PRODUCT_CODE:newsletter}
  core:
    base-url: ${NEWSLETTER_CORE_BASE_URL:http://localhost:8000}
    authorization-path: ${NEWSLETTER_CORE_AUTH_PATH:/v1/authorization/check}
    product-access-path-template: ${NEWSLETTER_CORE_PRODUCT_ACCESS_PATH_TEMPLATE:/v1/tenants/{tenantId}/products/{productCode}/access/me}
    tenants-path: ${NEWSLETTER_CORE_TENANTS_PATH:/v1/tenants}
  n8n:
    base-url: ${NEWSLETTER_N8N_BASE_URL:http://localhost:5678}
    generate-path: ${NEWSLETTER_N8N_GENERATE_PATH:/webhook/newsletter-generate}
    agent-generate-path: ${NEWSLETTER_N8N_AGENT_GENERATE_PATH:/webhook/newsletter-agent-generate}
  cors:
    allowed-origin-patterns: ${NEWSLETTER_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}
